---
# role: samba_ad_dc
# file: defaults/main.yml

# Initialize a new domain (provision) or add a writable DC to an existing domain (join).
samba_ad_dc_mode: provision
# Example: samba_ad_dc_mode: join

# Existing DC DNS hostname; required in join mode, unused in provision mode.
# samba_ad_dc_join_server:
# Example: samba_ad_dc_join_server: dc1.ad.example.com

# Existing AD site for the joined DC; omitted lets Samba choose the site.
# samba_ad_dc_join_site:
# Example: samba_ad_dc_join_site: Default-First-Site-Name

# Kerberos realm and DNS domain to provision or join; required and immutable after initialization.
# samba_ad_dc_realm:
# Example: samba_ad_dc_realm: AD.EXAMPLE.COM

# NetBIOS domain name; required and immutable after provisioning.
# samba_ad_dc_domain:
# Example: samba_ad_dc_domain: EXAMPLE

# Administrator password for provisioning, joining, and password policies; supplied through a secret store.
# samba_ad_dc_admin_password:
# Example: samba_ad_dc_admin_password: "{{ vault_samba_ad_dc_admin_password }}"

# Short DNS hostname of the domain controller; immutable after provisioning.
samba_ad_dc_hostname: "{{ ansible_facts.hostname }}"
# Example: samba_ad_dc_hostname: dc1

# DC functional level; initial provisioning also sets the domain and forest levels to this value.
samba_ad_dc_function_level: "2016"
# Example: samba_ad_dc_function_level: "2008_R2"

# Enable RFC2307 POSIX attributes during domain provisioning.
samba_ad_dc_use_rfc2307: true

# Schema extensions to manage on the schema master; removing entries preserves existing schema.
# Choices: laps, sshpublickey, ldapcompat
samba_ad_dc_schema_extensions: []
# Example: samba_ad_dc_schema_extensions: [laps, sshpublickey, ldapcompat]

# Upstream DNS server addresses; an empty list disables external DNS forwarding.
samba_ad_dc_dns_forwarders: []
# Example: samba_ad_dc_dns_forwarders: [192.0.2.53, 192.0.2.54]

# Dynamic RPC server port range; align firewall rules with the selected range.
samba_ad_dc_rpc_dynamic_port_range: 49152-65535
# Example: samba_ad_dc_rpc_dynamic_port_range: 50000-55000

# Encryption types accepted by the domain controller's Kerberos KDC.
samba_ad_dc_kdc_supported_enctypes:
  - aes128-cts-hmac-sha1-96
  - aes256-cts-hmac-sha1-96

# Kerberos encryption types for accounts without an explicit encryption-type value.
samba_ad_dc_kdc_default_domain_supported_enctypes:
  - aes128-cts-hmac-sha1-96
  - aes256-cts-hmac-sha1-96

# Domain password and lockout settings; all fields are optional and unspecified settings remain unchanged.
samba_ad_dc_password_policy: {}
# Example:
# samba_ad_dc_password_policy:
#   minimum_length: 12  # Minimum password length in characters.
#   history_length: 24  # Number of previous passwords that cannot be reused.
#   minimum_age_days: 0  # Integer days; 0 permits immediate changes.
#   maximum_age_days: 0  # Integer days; 0 disables expiration, otherwise greater than minimum_age_days.
#   lockout_threshold: 5  # Failed sign-ins before lockout; 0 disables lockout.
#   lockout_duration_minutes: 30  # Integer minutes; 0 requires administrator unlock.
#   lockout_window_minutes: 30  # Integer minutes before the failed sign-in counter resets.
#   complexity: true  # Require password complexity.
#   reversible_encryption: false  # Whether passwords are stored using reversible encryption.

# Fine-grained password policies and their user or global-security-group assignments.
# settings accepts the same options as samba_ad_dc_password_policy and overrides its configured values.
# Other settings inherit domain values on creation and remain unchanged on subsequent runs.
# Removing an entry stops management; state: absent deletes the policy.
samba_ad_dc_password_settings: []
# Example:
# samba_ad_dc_password_settings:
#   - name: domain_admins  # Required password settings object (PSO) name.
#     precedence: 10  # Required for present policies; lower numbers have higher priority.
#     applies_to:  # Exact set of user or global security group account names or DNs; defaults to [].
#       - Domain Admins
#     settings:  # Optional overrides; defaults to {}.
#       minimum_length: 16
#     state: present  # present (default) or absent.

# Restrict anonymous SAMR and IPC access; 2 also denies anonymous IPC connections.
samba_ad_dc_restrict_anonymous: 2

# Minimum SMB dialect accepted by the DC; SMB3 selects Samba's SMB3_11 alias.
samba_ad_dc_server_min_protocol: SMB3

# Require signatures on SMB connections to protect their integrity.
samba_ad_dc_server_signing: mandatory

# Accepted NTLM authentication; Kerberos remains preferred and NTLMv1 is rejected.
samba_ad_dc_ntlm_auth: ntlmv2-only

# Require TLS for simple LDAP binds and signing or sealing for SASL over plain LDAP.
samba_ad_dc_ldap_require_strong_auth: "yes"

# Additional password hashes for external LDAP synchronization; disabled by default.
samba_ad_dc_password_hash_schemes: []
# Example: samba_ad_dc_password_hash_schemes: [CryptSHA256, CryptSHA512]

# Enable LDAPS and StartTLS; disabling TLS does not permit unprotected LDAP binds.
samba_ad_dc_tls_enabled: true

# PEM private key on the DC; the default is generated by Samba relative to its private directory.
samba_ad_dc_tls_keyfile: tls/key.pem
# Example: samba_ad_dc_tls_keyfile: /etc/samba/tls/dc1.key

# PEM server certificate and intermediate chain; the default is generated by Samba.
samba_ad_dc_tls_certfile: tls/cert.pem
# Example: samba_ad_dc_tls_certfile: /etc/samba/tls/dc1.crt

# PEM CA bundle on the DC; the default is generated by Samba.
samba_ad_dc_tls_cafile: tls/ca.pem
# Example: samba_ad_dc_tls_cafile: /etc/samba/tls/ca.crt

# Optional existing PEM revocation list on the DC; empty leaves it unconfigured.
samba_ad_dc_tls_crlfile: ""
# Example: samba_ad_dc_tls_crlfile: /etc/samba/tls/ca.crl

# Optional existing DH parameter file on the DC; empty uses GnuTLS defaults.
samba_ad_dc_tls_dh_params_file: ""
# Example: samba_ad_dc_tls_dh_params_file: /etc/samba/tls/dhparams.pem

# GnuTLS cipher policy with TLS 1.2 and 1.3 only and at least 128-bit cipher security.
samba_ad_dc_tls_priority: SECURE128:-VERS-ALL:+VERS-TLS1.3:+VERS-TLS1.2

# Audit authentication including anonymous sessions, directory changes, and transaction outcomes.
samba_ad_dc_log_level: >-
  1
  auth_json_audit:5@/var/log/samba/auth_json_audit.log
  dsdb_json_audit:5@/var/log/samba/dsdb_json_audit.log
  dsdb_password_json_audit:5@/var/log/samba/dsdb_password_json_audit.log
  dsdb_group_json_audit:5@/var/log/samba/dsdb_group_json_audit.log
  dsdb_transaction_json_audit:10@/var/log/samba/dsdb_transaction_json_audit.log
  kerberos:3@/var/log/samba/kerberos.log
  drs_repl:2@/var/log/samba/drs_repl.log
  full_audit:1@/var/log/samba/sysvol_audit.log
  dns:2@/var/log/samba/dns.log

# Maximum size in KiB per Samba log before rotation to one .old file; 0 is unlimited.
samba_ad_dc_max_log_size: 10000

# All successful VFS operations, including reads, ACL changes, and newly supported operations.
samba_ad_dc_audit_success: [all]

# All failed VFS operations, including denied reads, ACL changes, and metadata access.
samba_ad_dc_audit_failure: [all]

# Record the requested Windows security descriptor in SDDL when clients change ACLs.
samba_ad_dc_audit_log_secdesc: true
