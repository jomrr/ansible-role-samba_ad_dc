---
# role: samba_dc
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install, provision, configure, enable, and start a Samba AD domain
      controller.
    options:
      samba_dc_realm:
        type: str
        required: true
        description: Kerberos realm and DNS domain of the new forest; immutable after provisioning.
      samba_dc_domain:
        type: str
        required: true
        description: NetBIOS domain name; immutable after provisioning.
      samba_dc_admin_password:
        type: str
        required: true
        no_log: true
        description: Administrator password for provisioning and directory settings, supplied
          through a secret store.
      samba_dc_hostname:
        type: str
        default: '{{ ansible_facts.hostname }}'
        description: Short DNS hostname of the DC; must match the host identity and is immutable
          after provisioning.
      samba_dc_function_level:
        type: str
        default: '2016'
        choices:
          - 2008_R2
          - '2012'
          - 2012_R2
          - '2016'
        description: Domain, forest, and DC functional level for initial provisioning; keep
          unchanged afterwards.
      samba_dc_use_rfc2307:
        type: bool
        default: true
        description: Enable RFC2307 POSIX attributes at provision time and their use by
          the DC.
      samba_dc_laps:
        type: bool
        default: false
        description: Prepare the Windows LAPS schema; OU permissions and client policies
          are configured separately. Disabling preserves existing schema extensions.
      samba_dc_dns_forwarders:
        type: list
        elements: str
        default: []
        description: Upstream DNS server addresses; an empty list disables external DNS
          forwarding.
      samba_dc_dns_reserved_names:
        type: list
        elements: str
        default:
          - wpad
          - isatap
        description: DNS names reserved with administrator-owned loopback A records; an
          empty list stops management.
      samba_dc_rpc_dynamic_port_range:
        type: str
        default: 49152-65535
        description: Dynamic RPC server port range; firewall rules must match.
      samba_dc_kdc_supported_enctypes:
        type: list
        elements: str
        default:
          - aes128-cts-hmac-sha1-96
          - aes256-cts-hmac-sha1-96
        description: Encryption types accepted by the KDC; defaults exclude RC4.
      samba_dc_kdc_default_domain_supported_enctypes:
        type: list
        elements: str
        default:
          - aes128-cts-hmac-sha1-96
          - aes256-cts-hmac-sha1-96
        description: Encryption types for accounts without an explicit encryption-type value.
      samba_dc_ous:
        type: list
        elements: dict
        default: []
        description: Organizational units in parent-before-child order; deletion uses reverse
          order and requires empty OUs.
        options:
          name:
            type: str
            required: true
            description: Object name.
          path:
            type: str
            required: true
            description: Parent container DN; must exist before the object is managed.
          description:
            type: str
            description: Directory object description; omitted leaves it unchanged.
          state:
            type: str
            default: present
            choices:
              - present
              - absent
            description: Whether the object exists; absent explicitly deletes it.
      samba_dc_users:
        type: list
        elements: dict
        default: []
        description: Domain user accounts; omitted entries are left unmanaged.
        options:
          username:
            type: str
            required: true
            description: User logon name (sAMAccountName).
          given_name:
            type: str
            description: Given name.
          surname:
            type: str
            description: Surname.
          display_name:
            type: str
            description: Display name.
          email:
            type: str
            description: Email address.
          description:
            type: str
            description: Directory object description; omitted leaves it unchanged.
          uid_number:
            type: int
            description: RFC2307 user ID.
          gid_number:
            type: int
            description: RFC2307 group ID.
          unix_home_directory:
            type: str
            description: RFC2307 home directory.
          login_shell:
            type: str
            description: RFC2307 login shell.
          gecos:
            type: str
            description: RFC2307 GECOS field.
          enabled:
            type: bool
            default: true
            description: Whether the user account is enabled.
          password:
            type: str
            description: Initial account password; required for creation and supplied through
              a secret store.
            no_log: true
          update_password:
            type: str
            choices:
              - on_create
              - always
            description: Override samba_dc_user_update_password for this account.
          path:
            type: str
            description: Parent container DN; must exist before the object is managed.
          state:
            type: str
            default: present
            choices:
              - present
              - absent
            description: Whether the object exists; absent explicitly deletes it.
      samba_dc_groups:
        type: list
        elements: dict
        default: []
        description: Domain groups and optional memberships; all groups are created before
          resolving nested memberships.
        options:
          name:
            type: str
            required: true
            description: Object name.
          scope:
            type: str
            default: global
            choices:
              - global
              - domain_local
              - universal
            description: Group scope.
          category:
            type: str
            default: security
            choices:
              - security
              - distribution
            description: Security or distribution group.
          description:
            type: str
            description: Directory object description; omitted leaves it unchanged.
          gid_number:
            type: int
            description: RFC2307 group ID.
          members:
            type: list
            elements: str
            description: Member account names; omitted leaves membership unmanaged, an empty
              list is managed.
          members_purge:
            type: bool
            description: Override samba_dc_group_members_purge for this group.
          path:
            type: str
            description: Parent container DN; must exist before the object is managed.
          state:
            type: str
            default: present
            choices:
              - present
              - absent
            description: Whether the object exists; absent explicitly deletes it.
      samba_dc_user_update_password:
        type: str
        default: on_create
        choices:
          - on_create
          - always
        description: User password update policy; always intentionally changes passwords
          on every run. Overridable per user.
      samba_dc_group_members_purge:
        type: bool
        default: false
        description: Remove unlisted group members when members is supplied; overridable
          per group.
      samba_dc_password_policy:
        type: dict
        default: {}
        options:
          minimum_length:
            type: int
            description: Minimum password length in characters.
          history_length:
            type: int
            description: Number of previous passwords that cannot be reused.
          minimum_age_days:
            type: int
            description: Minimum password age in days; 0 permits immediate changes.
          maximum_age_days:
            type: int
            description: Maximum password age in days; 0 disables expiration.
          lockout_threshold:
            type: int
            description: Failed sign-ins before account lockout; 0 disables lockout.
          lockout_duration_minutes:
            type: int
            description: Account lockout duration in minutes; 0 requires administrator unlock.
          lockout_window_minutes:
            type: int
            description: Minutes before the failed sign-in counter is reset.
          complexity:
            type: bool
            description: Require password complexity.
          reversible_encryption:
            type: bool
            description: Store passwords using reversible encryption.
        description: Domain password and lockout settings; unspecified values remain unchanged.
      samba_dc_password_settings:
        type: list
        elements: dict
        default: []
        description: Fine-grained password policies; item settings override the configured
          domain password settings.
        options:
          name:
            type: str
            required: true
            description: PSO name.
          precedence:
            type: int
            description: Priority, lowest first; required for present policies.
          applies_to:
            type: list
            elements: str
            default: []
            description: Exact set of users and global security groups, identified by account
              name or DN.
          settings:
            type: dict
            default: {}
            options:
              minimum_length:
                type: int
                description: Minimum password length in characters.
              history_length:
                type: int
                description: Number of previous passwords that cannot be reused.
              minimum_age_days:
                type: int
                description: Minimum password age in days; 0 permits immediate changes.
              maximum_age_days:
                type: int
                description: Maximum password age in days; 0 disables expiration.
              lockout_threshold:
                type: int
                description: Failed sign-ins before account lockout; 0 disables lockout.
              lockout_duration_minutes:
                type: int
                description: Account lockout duration in minutes; 0 requires administrator
                  unlock.
              lockout_window_minutes:
                type: int
                description: Minutes before the failed sign-in counter is reset.
              complexity:
                type: bool
                description: Require password complexity.
              reversible_encryption:
                type: bool
                description: Store passwords using reversible encryption.
            description: Overrides of the configured domain password settings.
          state:
            type: str
            choices:
              - present
              - absent
            default: present
            description: Whether the PSO exists.
      samba_dc_restrict_anonymous:
        type: int
        default: 2
        choices:
          - 0
          - 1
          - 2
        description: Restriction of anonymous SAMR and IPC access; 2 denies anonymous IPC
          connections.
      samba_dc_server_min_protocol:
        type: str
        default: SMB3
        choices:
          - SMB2_02
          - SMB2_10
          - SMB3
          - SMB3_00
          - SMB3_02
          - SMB3_11
        description: Minimum accepted SMB dialect; SMB3 is Samba's alias for SMB3_11 and
          rejects older dialects.
      samba_dc_server_signing:
        type: str
        default: mandatory
        choices:
          - default
          - auto
          - mandatory
        description: SMB signing policy; mandatory requires integrity protection.
      samba_dc_ntlm_auth:
        type: str
        default: ntlmv2-only
        choices:
          - ntlmv2-only
          - disabled
        description: Accept NTLMv2 fallback or require Kerberos; NTLMv1 is unsupported.
      samba_dc_ldap_require_strong_auth:
        type: str
        default: 'yes'
        choices:
          - 'yes'
          - allow_sasl_without_tls_channel_bindings
        description: LDAP protection policy; simple binds require TLS and plain SASL requires
          signing or sealing.
      samba_dc_password_hash_schemes:
        type: list
        elements: str
        default: []
        description: Additional userPassword hashes for external LDAP synchronization; disabled
          by default.
      samba_dc_tls_enabled:
        type: bool
        default: true
        description: Enable LDAPS and StartTLS; disabling TLS preserves the LDAP strong
          authentication policy.
      samba_dc_tls_keyfile:
        type: path
        default: tls/key.pem
        description: PEM private key on the DC, absolute or relative to Samba's private
          directory; default is generated by Samba.
      samba_dc_tls_certfile:
        type: path
        default: tls/cert.pem
        description: PEM server certificate and intermediate chain on the DC; default is
          generated by Samba.
      samba_dc_tls_cafile:
        type: path
        default: tls/ca.pem
        description: PEM CA bundle on the DC; default is generated by Samba.
      samba_dc_tls_crlfile:
        type: str
        default: ''
        description: Optional existing PEM revocation list on the DC; empty leaves it unconfigured.
      samba_dc_tls_dh_params_file:
        type: str
        default: ''
        description: Optional existing DH parameter file on the DC; empty uses GnuTLS defaults.
      samba_dc_tls_priority:
        type: str
        default: SECURE128:-VERS-ALL:+VERS-TLS1.3:+VERS-TLS1.2
        description: GnuTLS cipher policy; defaults to TLS 1.2 and 1.3 with at least 128-bit
          cipher security.
      samba_dc_log_level:
        type: str
        default: 1 auth_json_audit:5@/var/log/samba/auth_json_audit.log dsdb_json_audit:5@/var/log/samba/dsdb_json_audit.log
          dsdb_password_json_audit:5@/var/log/samba/dsdb_password_json_audit.log dsdb_group_json_audit:5@/var/log/samba/dsdb_group_json_audit.log
          dsdb_transaction_json_audit:10@/var/log/samba/dsdb_transaction_json_audit.log
          kerberos:3@/var/log/samba/kerberos.log drs_repl:2@/var/log/samba/drs_repl.log
          full_audit:1@/var/log/samba/sysvol_audit.log dns:2@/var/log/samba/dns.log
        description: Samba audit classes and destinations, including authentication, directory
          changes, and SYSVOL writes.
      samba_dc_max_log_size:
        type: int
        default: 10000
        description: Maximum size in KiB per Samba log before rotation to one .old file;
          0 disables the limit.
      samba_dc_audit_success:
        type: list
        elements: str
        default:
          - all
        description: Successful VFS operations to audit; all includes reads, ACL changes,
          and newly supported operations.
      samba_dc_audit_failure:
        type: list
        elements: str
        default:
          - all
        description: Failed VFS operations to audit; all includes denied reads, ACL changes,
          and metadata access.
      samba_dc_audit_log_secdesc:
        type: bool
        default: true
        description: Record the requested Windows security descriptor in SDDL when clients
          change ACLs.
