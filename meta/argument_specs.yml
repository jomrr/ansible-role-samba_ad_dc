---
# role: samba_dc
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Install, provision, configure, enable, and start a Samba AD domain
      controller.
    options:
      samba_dc_realm:
        type: str
        required: true
        description: Kerberos realm and DNS domain of the new forest; immutable after provisioning.
      samba_dc_domain:
        type: str
        required: true
        description: NetBIOS domain name; immutable after provisioning.
      samba_dc_admin_password:
        type: str
        required: true
        no_log: true
        description: Initial Administrator password supplied through Ansible Vault or a
          secret store.
      samba_dc_hostname:
        type: str
        default: '{{ ansible_facts.hostname }}'
        description: Short DNS hostname of the DC; must match the host identity and is immutable
          after provisioning.
      samba_dc_function_level:
        type: str
        default: '2016'
        choices:
          - 2008_R2
          - '2012'
          - 2012_R2
          - '2016'
        description: Domain, forest, and DC functional level for initial provisioning; keep
          unchanged afterwards.
      samba_dc_use_rfc2307:
        type: bool
        default: true
        description: Enable RFC2307 POSIX attributes at provision time and their use by
          the DC.
      samba_dc_laps:
        type: bool
        default: false
        description: Prepare the Windows LAPS schema; OU permissions and client policies
          are configured separately. Disabling preserves existing schema extensions.
      samba_dc_dns_forwarders:
        type: list
        elements: str
        default: []
        description: Upstream DNS server addresses; an empty list disables external DNS
          forwarding.
      samba_dc_restrict_anonymous:
        type: int
        default: 2
        choices:
          - 0
          - 1
          - 2
        description: Restriction of anonymous SAMR and IPC access; 2 denies anonymous IPC
          connections.
      samba_dc_server_min_protocol:
        type: str
        default: SMB3
        choices:
          - SMB2_02
          - SMB2_10
          - SMB3
          - SMB3_00
          - SMB3_02
          - SMB3_11
        description: Minimum accepted SMB dialect; SMB3 is Samba's alias for SMB3_11 and
          rejects older dialects.
      samba_dc_server_signing:
        type: str
        default: mandatory
        choices:
          - default
          - auto
          - mandatory
        description: SMB signing policy; mandatory requires integrity protection.
      samba_dc_ntlm_auth:
        type: str
        default: ntlmv2-only
        choices:
          - ntlmv2-only
          - disabled
        description: Accept NTLMv2 fallback or require Kerberos; NTLMv1 is unsupported.
      samba_dc_ldap_require_strong_auth:
        type: str
        default: 'yes'
        choices:
          - 'yes'
          - allow_sasl_without_tls_channel_bindings
        description: LDAP protection policy; simple binds require TLS and plain SASL requires
          signing or sealing.
      samba_dc_password_hash_schemes:
        type: list
        elements: str
        default: []
        description: Additional userPassword hashes for external LDAP synchronization; disabled
          by default.
      samba_dc_tls_enabled:
        type: bool
        default: true
        description: Enable LDAPS and StartTLS; disabling TLS preserves the LDAP strong
          authentication policy.
      samba_dc_tls_keyfile:
        type: path
        default: tls/key.pem
        description: PEM private key on the DC, absolute or relative to Samba's private
          directory; default is generated by Samba.
      samba_dc_tls_certfile:
        type: path
        default: tls/cert.pem
        description: PEM server certificate and intermediate chain on the DC; default is
          generated by Samba.
      samba_dc_tls_cafile:
        type: path
        default: tls/ca.pem
        description: PEM CA bundle on the DC; default is generated by Samba.
      samba_dc_tls_crlfile:
        type: str
        default: ''
        description: Optional existing PEM revocation list on the DC; empty leaves it unconfigured.
      samba_dc_tls_dh_params_file:
        type: str
        default: ''
        description: Optional existing DH parameter file on the DC; empty uses GnuTLS defaults.
      samba_dc_tls_priority:
        type: str
        default: SECURE128:-VERS-ALL:+VERS-TLS1.3:+VERS-TLS1.2
        description: GnuTLS cipher policy; defaults to TLS 1.2 and 1.3 with at least 128-bit
          cipher security.
      samba_dc_log_level:
        type: str
        default: 1 auth_json_audit:5@/var/log/samba/auth_json_audit.log dsdb_json_audit:5@/var/log/samba/dsdb_json_audit.log
          dsdb_password_json_audit:5@/var/log/samba/dsdb_password_json_audit.log dsdb_group_json_audit:5@/var/log/samba/dsdb_group_json_audit.log
          dsdb_transaction_json_audit:10@/var/log/samba/dsdb_transaction_json_audit.log
          kerberos:3@/var/log/samba/kerberos.log drs_repl:2@/var/log/samba/drs_repl.log
          full_audit:1@/var/log/samba/sysvol_audit.log dns:2@/var/log/samba/dns.log
        description: Samba audit classes and destinations, including authentication, directory
          changes, and SYSVOL writes.
      samba_dc_max_log_size:
        type: int
        default: 10000
        description: Maximum size in KiB per Samba log before rotation to one .old file;
          0 disables the limit.
      samba_dc_audit_success:
        type: list
        elements: str
        default:
          - all
        description: Successful VFS operations to audit; all includes reads, ACL changes,
          and newly supported operations.
      samba_dc_audit_failure:
        type: list
        elements: str
        default:
          - all
        description: Failed VFS operations to audit; all includes denied reads, ACL changes,
          and metadata access.
      samba_dc_audit_log_secdesc:
        type: bool
        default: true
        description: Record the requested Windows security descriptor in SDDL when clients
          change ACLs.
