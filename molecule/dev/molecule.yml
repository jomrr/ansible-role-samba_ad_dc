---
# role: samba_dc
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        __samba_dc_test_rootless: true
        samba_dc_realm: "AD.EXAMPLE.TEST"
        samba_dc_domain: "EXAMPLE"
        samba_dc_hostname: "dc1"
        samba_dc_laps: true
        samba_dc_rpc_dynamic_port_range: "50000-55000"
        samba_dc_ous:
          - name: "Molecule"
            path: "DC=ad,DC=example,DC=test"
          - name: "Staff"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
            description: "Initial staff OU"
          - name: "Groups"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
          - name: "Retired"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
          - name: "Children"
            path: "OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
        samba_dc_users:
          - username: "moleculereader"
            password: "Molecule-Only-Reader1!"
          - username: "molecule-managed"
            password: "Molecule-Managed-Account1!"
            path: "OU=Staff,OU=Molecule,DC=ad,DC=example,DC=test"
            display_name: "Initial managed user"
            uid_number: 21001
            gid_number: 21000
          - username: "molecule-retired"
            password: "Molecule-Retired-Account1!"
            path: "OU=Children,OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
        samba_dc_groups:
          - name: "molecule-parent-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-managed-group"
            members_purge: false
          - name: "molecule-managed-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-managed"
            description: "Initial managed group"
            gid_number: 21000
          - name: "molecule-scope-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            scope: "universal"
            category: "distribution"
            members:
              - "molecule-managed-group"
          - name: "molecule-audit-group"
            members:
              - "moleculereader"
          - name: "molecule-retired-group"
            path: "OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-retired"
        samba_dc_password_policy:
          minimum_length: 12
          history_length: 24
          minimum_age_days: 0
          maximum_age_days: 0
          complexity: true
          reversible_encryption: false
        samba_dc_password_settings:
          - name: "domain_admins"
            precedence: 10
            applies_to:
              - "Domain Admins"
            settings:
              minimum_length: 16
          - name: "molecule-managed"
            precedence: 20
            applies_to:
              - "molecule-parent-group"
            settings:
              minimum_length: 14
          - name: "molecule-delete"
            precedence: 30
        samba_dc_admin_password: "Molecule-Only-Adm1n!"
        samba_dc_tls_keyfile: "/etc/samba/tls/dc1.key"
        samba_dc_tls_certfile: "/etc/samba/tls/dc1.crt"
        samba_dc_tls_cafile: "/etc/samba/tls/ca.crt"
        __samba_dc_test_cafile: "/etc/samba/tls/ca.crt"
    host_vars:
      samba-dc-debian:
        samba_dc_tls_keyfile: "tls/key.pem"
        samba_dc_tls_certfile: "tls/cert.pem"
        samba_dc_tls_cafile: "tls/ca.pem"
        __samba_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
      samba-dc-ubuntu:
        samba_dc_tls_keyfile: "tls/key.pem"
        samba_dc_tls_certfile: "tls/cert.pem"
        samba_dc_tls_cafile: "tls/ca.pem"
        __samba_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
  connection_options:
    ansible_user: "molecule"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "destroy"
  name: "dev"
platforms:
  - name: "samba-dc-almalinux"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-dc-debian"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-dc-fedora"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-dc-suse"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-dc-ubuntu"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
