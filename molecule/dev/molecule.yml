---
# role: samba_ad_dc
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        __samba_ad_dc_test_rootless: true
        samba_ad_dc_realm: "AD.EXAMPLE.TEST"
        samba_ad_dc_domain: "EXAMPLE"
        samba_ad_dc_hostname: "dc1"
        samba_ad_dc_schema_extensions:
          - "laps"
          - "sshpublickey"
          - "ldapcompat"
        samba_ad_dc_rpc_dynamic_port_range: "50000-55000"
        samba_ad_dc_admin_password: "Molecule-Only-Adm1n!"
        samba_ad_dc_tls_keyfile: "/etc/samba/tls/dc1.key"
        samba_ad_dc_tls_certfile: "/etc/samba/tls/dc1.crt"
        samba_ad_dc_tls_cafile: "/etc/samba/tls/ca.crt"
        __samba_ad_dc_test_cafile: "/etc/samba/tls/ca.crt"
      samba_ad_dc_joiners:
        samba_ad_dc_mode: "join"
        samba_ad_dc_hostname: "dc2"
        samba_ad_dc_join_server: "dc1.ad.example.test"
        samba_ad_dc_join_site: "Default-First-Site-Name"
        samba_ad_dc_schema_extensions: []
        samba_ad_dc_tls_keyfile: "tls/key.pem"
        samba_ad_dc_tls_certfile: "tls/cert.pem"
        samba_ad_dc_tls_cafile: "tls/ca.pem"
        __samba_ad_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
        __samba_ad_dc_test_source: "{{ inventory_hostname.removesuffix('-join') }}"
      samba_ad_dc_sources:
        samba_ad_dc_password_policy:
          minimum_length: 12
          history_length: 24
          minimum_age_days: 0
          maximum_age_days: 0
          complexity: true
          reversible_encryption: false
        samba_ad_dc_password_settings:
          - name: "domain_admins"
            precedence: 10
            applies_to:
              - "Domain Admins"
            settings:
              minimum_length: 16
          - name: "molecule-managed"
            precedence: 20
            applies_to:
              - "Domain Admins"
            settings:
              minimum_length: 14
          - name: "molecule-delete"
            precedence: 30
    host_vars:
      samba-ad-dc-debian:
        samba_ad_dc_tls_keyfile: "tls/key.pem"
        samba_ad_dc_tls_certfile: "tls/cert.pem"
        samba_ad_dc_tls_cafile: "tls/ca.pem"
        __samba_ad_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
      samba-ad-dc-ubuntu:
        samba_ad_dc_tls_keyfile: "tls/key.pem"
        samba_ad_dc_tls_certfile: "tls/cert.pem"
        samba_ad_dc_tls_cafile: "tls/ca.pem"
        __samba_ad_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
  connection_options:
    ansible_user: "molecule"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "destroy"
  name: "dev"
platforms:
  - name: "samba-ad-dc-almalinux"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    groups:
      - "samba_ad_dc_sources"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-almalinux-join"
    hostname: "dc2"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    groups:
      - "samba_ad_dc_joiners"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-debian"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-debian:latest"
    groups:
      - "samba_ad_dc_sources"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-debian-join"
    hostname: "dc2"
    image: "docker.io/jomrr/molecule-debian:latest"
    groups:
      - "samba_ad_dc_joiners"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-fedora"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-fedora:latest"
    groups:
      - "samba_ad_dc_sources"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-fedora-join"
    hostname: "dc2"
    image: "docker.io/jomrr/molecule-fedora:latest"
    groups:
      - "samba_ad_dc_joiners"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-suse"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    groups:
      - "samba_ad_dc_sources"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-suse-join"
    hostname: "dc2"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    groups:
      - "samba_ad_dc_joiners"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-ubuntu"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    groups:
      - "samba_ad_dc_sources"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-dc-ubuntu-join"
    hostname: "dc2"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    groups:
      - "samba_ad_dc_joiners"
    network: "samba-ad-dc-${MOLECULE_SCENARIO_NAME}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
