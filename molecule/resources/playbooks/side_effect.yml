---
# role: samba_ad_dc
# file: molecule/resources/playbooks/side_effect.yml

- name: SAMBA_AD_DC | Verify password policy updates and TLS and LAPS opt outs
  hosts: samba_ad_dc_sources
  gather_facts: true
  environment: &__samba_ad_dc_test_kdc_environment
    KRB5_CONFIG: /tmp/molecule-dc-krb5.conf
  module_defaults:
    group/jomrr.samba.all:
      server: dc1.ad.example.test
      realm: '{{ samba_ad_dc_realm }}'
      bind_username: Administrator
      bind_password: '{{ samba_ad_dc_admin_password }}'
    samba_ad_dc_test_password_policies:
      server: dc1.ad.example.test
      realm: '{{ samba_ad_dc_realm }}'
      bind_username: Administrator
      bind_password: '{{ samba_ad_dc_admin_password }}'
  tasks:
    - name: SAMBA_AD_DC | Seed precise unmanaged policy intervals
      samba_ad_dc_test_password_policies:
        phase: seed

    - name: SAMBA_AD_DC | Preview password policy updates and deletions
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        apply:
          check_mode: true
      vars:
        samba_ad_dc_password_policy: &__samba_ad_dc_updated_password_policy
          minimum_length: 13
          history_length: 25
          complexity: true
          reversible_encryption: false
        samba_ad_dc_password_settings: &__samba_ad_dc_updated_password_settings

          - name: molecule-managed
            precedence: 5
            applies_to:
              - moleculereader
            settings:
              minimum_length: 18

          - name: molecule-inherited
            precedence: 40

          - name: molecule-delete
            state: absent

    - name: SAMBA_AD_DC | Verify check mode preserved the seeded policies
      samba_ad_dc_test_password_policies:
        phase: seeded

    - name: SAMBA_AD_DC | Apply password policy updates and TLS and LAPS opt outs
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        samba_ad_dc_tls_enabled: false
        samba_ad_dc_laps: false

        samba_ad_dc_password_policy: *__samba_ad_dc_updated_password_policy
        samba_ad_dc_password_settings: *__samba_ad_dc_updated_password_settings

    - name: SAMBA_AD_DC | Verify updated deleted and inherited password policies
      samba_ad_dc_test_password_policies:
        phase: updated

    - name: SAMBA_AD_DC | Verify Windows LAPS remains usable after opting out
      samba_ad_dc_test_laps:
        server: dc1.ad.example.test
        password: "{{ samba_ad_dc_admin_password }}"
      no_log: true

    - name: SAMBA_AD_DC | Verify LDAPS is disabled
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 636
        state: stopped
        timeout: 30

    - name: SAMBA_AD_DC | Update the replication test account
      jomrr.samba.samba_user:
        username: moleculereader
        description: Updated on the source DC

- name: SAMBA_AD_DC | Verify subsequent changes replicate to the joined controller
  hosts: samba_ad_dc_joiners
  gather_facts: false
  environment: *__samba_ad_dc_test_kdc_environment
  tasks:
    - name: SAMBA_AD_DC | Observe the account update on the joined DC
      jomrr.samba.samba_user_info:
        server: dc2.ad.example.test
        realm: '{{ samba_ad_dc_realm }}'
        bind_username: Administrator
        bind_password: '{{ samba_ad_dc_admin_password }}'
        username: moleculereader
      register: __samba_ad_dc_replicated_updates
      until: __samba_ad_dc_replicated_updates is succeeded and __samba_ad_dc_replicated_updates.users |
        length == 1 and __samba_ad_dc_replicated_updates.users[0].description == 'Updated on the source DC'
      retries: 60
      delay: 2
