---
# role: samba_dc
# file: molecule/resources/playbooks/side_effect.yml

- name: SAMBA_DC | Verify TLS and LAPS opt outs
  hosts: all
  gather_facts: true
  tasks:
    - name: SAMBA_DC | Exercise the supported TLS opt out
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        samba_dc_tls_enabled: false
        samba_dc_laps: false

    - name: SAMBA_DC | Verify Windows LAPS remains usable after opting out
      samba_dc_test_laps:
        server: dc1.ad.example.test
        password: "{{ samba_dc_admin_password }}"
      no_log: true

    - name: SAMBA_DC | Verify LDAPS is disabled
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 636
        state: stopped
        timeout: 30
