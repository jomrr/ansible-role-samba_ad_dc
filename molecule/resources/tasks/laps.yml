---
# role: samba_dc
# file: molecule/resources/tasks/laps.yml

- name: SAMBA_DC | Exercise LAPS attributes over authenticated LDAP
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - -c
      - |
        import json
        import os
        import ldb
        from samba.credentials import Credentials, MUST_USE_KERBEROS
        from samba.param import LoadParm
        from samba.samdb import SamDB

        parameters = LoadParm()
        parameters.load_default()

        def connect(username, password):
            credentials = Credentials()
            credentials.guess(parameters)
            credentials.set_username(username)
            credentials.set_password(password)
            credentials.set_kerberos_state(MUST_USE_KERBEROS)
            return SamDB(url='ldap://dc1.ad.example.test', credentials=credentials, lp=parameters)

        administrator = connect('Administrator', os.environ['SAMBA_DC_TEST_PASSWORD'])
        reader = connect('moleculereader', 'Molecule-Only-Reader1!')
        computer_dn = f'CN=molecule-laps,CN=Computers,{administrator.domain_dn()}'
        password = 'Molecule-LAPS-Secret-Only1!'
        expiration = '134400000000000000'
        values = {
            'msLAPS-PasswordExpirationTime': [expiration.encode()],
            'msLAPS-Password': [json.dumps({'n': 'Administrator', 't': '1dd7e5398090000',
                                          'p': password}).encode()],
            'msLAPS-EncryptedPassword': [b'schema-test-current'],
            'msLAPS-EncryptedPasswordHistory': [b'schema-test-old-1', b'schema-test-old-2'],
            'msLAPS-EncryptedDSRMPassword': [b'schema-test-dsrm'],
            'msLAPS-EncryptedDSRMPasswordHistory': [b'schema-test-dsrm-1', b'schema-test-dsrm-2'],
            'msLAPS-CurrentPasswordVersion': [bytes(range(16))],
        }
        administrator.add({'dn': computer_dn, 'objectClass': 'computer',
                           'sAMAccountName': 'molecule-laps$', 'userAccountControl': '4096', **values})
        try:
            stored = administrator.search(base=computer_dn, scope=ldb.SCOPE_BASE, attrs=list(values))[0]
            for attribute, expected in values.items():
                if set(stored.get(attribute, [])) != set(expected):
                    raise RuntimeError(f'LAPS attribute round trip failed: {attribute}')
            visible = reader.search(base=computer_dn, scope=ldb.SCOPE_BASE, attrs=list(values))[0]
            if list(visible.get('msLAPS-PasswordExpirationTime', [])) != [expiration.encode()]:
                raise RuntimeError('Ordinary reader cannot read LAPS expiration time')
            for attribute in values:
                if attribute != 'msLAPS-PasswordExpirationTime' and attribute in visible:
                    raise RuntimeError(f'Ordinary reader can read confidential {attribute}')
        finally:
            administrator.delete(computer_dn)
  environment:
    SAMBA_DC_TEST_PASSWORD: "{{ samba_dc_admin_password }}"
  changed_when: false
  no_log: true
