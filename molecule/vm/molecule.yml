---
# role: samba_dc
# file: molecule/vm/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "vagrant"
  provider:
    name: "libvirt"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "~/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../vm/verify.yml"
    prepare: "../vm/prepare.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        __samba_dc_test_rootless: false
        samba_dc_realm: "AD.EXAMPLE.TEST"
        samba_dc_domain: "EXAMPLE"
        samba_dc_hostname: "dc1"
        samba_dc_laps: true
        samba_dc_rpc_dynamic_port_range: "50000-55000"
        samba_dc_password_policy:
          minimum_length: 12
          history_length: 24
          minimum_age_days: 0
          maximum_age_days: 0
          complexity: true
          reversible_encryption: false
        samba_dc_password_settings:
          - name: "domain_admins"
            precedence: 10
            applies_to:
              - "Domain Admins"
            settings:
              minimum_length: 16
        samba_dc_admin_password: "Molecule-Only-Adm1n!"
        samba_dc_tls_keyfile: "/etc/samba/tls/dc1.key"
        samba_dc_tls_certfile: "/etc/samba/tls/dc1.crt"
        samba_dc_tls_cafile: "/etc/samba/tls/ca.crt"
        __samba_dc_test_cafile: "/etc/samba/tls/ca.crt"
    host_vars:
      samba-dc-debian:
        samba_dc_tls_keyfile: "tls/key.pem"
        samba_dc_tls_certfile: "tls/cert.pem"
        samba_dc_tls_cafile: "tls/ca.pem"
        __samba_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
      samba-dc-ubuntu:
        samba_dc_tls_keyfile: "tls/key.pem"
        samba_dc_tls_certfile: "tls/cert.pem"
        samba_dc_tls_cafile: "tls/ca.pem"
        __samba_dc_test_cafile: "/var/lib/samba/private/tls/ca.pem"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "destroy"
  name: "vm"
platforms:
  - name: "samba-dc-vm-fedora"
    box: "samba-dc-fedora-44"
    provider_options:
      storage_pool_name: "${SAMBA_DC_VM_STORAGE_POOL:-default}"
    box_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Vagrant-libvirt-44-1.7.x86_64.vagrant.libvirt.box"
    box_download_checksum_type: "sha256"
    box_download_checksum: "4695d5ef2bfcc882649b98de0c545d04671d2064f6609e7e68e606718c8333dc"
    memory: 2048
    cpus: 2
    config_options:
      synced_folder: false
  - name: "samba-dc-vm-almalinux"
    box: "almalinux/10"
    provider_options:
      storage_pool_name: "${SAMBA_DC_VM_STORAGE_POOL:-default}"
    box_architecture: "amd64"
    memory: 2048
    cpus: 2
    config_options:
      synced_folder: false
