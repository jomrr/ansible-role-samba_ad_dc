---
# role: samba_ad_dc
# file: molecule/vm/prepare.yml

- name: SAMBA_AD_DC | Prepare SELinux VM prerequisites
  hosts: all
  gather_facts: true
  tasks:
    - name: SAMBA_AD_DC | Set the VM domain controller hostname
      become: true
      become_user: root
      ansible.builtin.hostname:
        name: dc1.ad.example.test

    - name: SAMBA_AD_DC | Install SELinux inspection tools and auditing
      become: true
      become_user: root
      ansible.builtin.package:
        name: [audit, policycoreutils-python-utils, python3-libselinux]
        state: present

    - name: SAMBA_AD_DC | Enable host auditing in the VM
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: auditd
        enabled: true
        state: started

    - name: SAMBA_AD_DC | Require SELinux Enforcing in the VM fixture
      ansible.builtin.assert:
        that:
          - ansible_facts.selinux.status == 'enabled'
          - ansible_facts.selinux.mode == 'enforcing'
          - ansible_facts.selinux.config_mode == 'enforcing'
        fail_msg: The VM image must boot with SELinux Enforcing.

- name: SAMBA_AD_DC | Prepare the shared domain controller fixture
  ansible.builtin.import_playbook: ../resources/playbooks/prepare.yml
