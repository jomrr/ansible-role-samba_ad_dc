---
# role: samba_dc
# file: tasks/directory.yml

- name: SAMBA_DC | Reserve DNS names against client registration
  jomrr.samba.samba_dns_record:
    zone: "{{ samba_dc_realm | lower }}"
    name: "{{ __samba_dc_reserved_name }}"
    type: A
    value: 127.0.0.1
    state: present
  loop: "{{ samba_dc_dns_reserved_names }}"
  loop_control:
    loop_var: __samba_dc_reserved_name

- name: SAMBA_DC | Configure the domain password policy
  samba_dc_password_policy:
    settings: "{{ samba_dc_password_policy }}"

- name: SAMBA_DC | Create organizational units in parent-before-child order
  jomrr.samba.samba_ou:
    name: "{{ __samba_dc_ou.name }}"
    path: "{{ __samba_dc_ou.path }}"
    description: "{{ __samba_dc_ou.description | default(omit) }}"
    state: present
  loop: "{{ samba_dc_ous }}"
  loop_control:
    loop_var: __samba_dc_ou
    label: "{{ __samba_dc_ou.name }}"
  when: (__samba_dc_ou.state | default('present')) == 'present'

- name: SAMBA_DC | Manage domain users
  ansible.builtin.import_tasks: users.yml

- name: SAMBA_DC | Manage domain groups and memberships
  ansible.builtin.import_tasks: groups.yml

- name: SAMBA_DC | Configure fine-grained password policies
  samba_dc_password_settings:
    name: "{{ __samba_dc_password_settings.name }}"
    precedence: "{{ __samba_dc_password_settings.precedence | default(omit) }}"
    applies_to: "{{ __samba_dc_password_settings.applies_to | default([]) }}"
    settings: "{{ samba_dc_password_policy | combine(__samba_dc_password_settings.settings | default({})) }}"
    state: "{{ __samba_dc_password_settings.state | default('present') }}"
  loop: "{{ samba_dc_password_settings }}"
  loop_control:
    loop_var: __samba_dc_password_settings
    label: "{{ __samba_dc_password_settings.name }}"

- name: SAMBA_DC | Remove empty organizational units in child-before-parent order
  jomrr.samba.samba_ou:
    name: "{{ __samba_dc_ou.name }}"
    path: "{{ __samba_dc_ou.path }}"
    state: absent
  loop: "{{ samba_dc_ous | reverse | list }}"
  loop_control:
    loop_var: __samba_dc_ou
    label: "{{ __samba_dc_ou.name }}"
  when: (__samba_dc_ou.state | default('present')) == 'absent'
