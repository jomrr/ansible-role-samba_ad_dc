---
# role: samba_ad_dc
# file: tasks/initialize.yml

- name: initialize | Install the validated domain controller configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ __samba_ad_dc_config }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "{{ __samba_ad_dc_validate }}"
  notify: restart domain controller

- name: initialize | Create the Kerberos profile directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/krb5.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: initialize | Configure the DC realm and Kerberos discovery
  become: true
  become_user: root
  ansible.builtin.template:
    src: 50-samba-ad-dc.conf.j2
    dest: /etc/krb5.conf.d/50-samba-ad-dc.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart domain controller

- name: initialize | Check for a local Kerberos profile
  ansible.builtin.stat:
    path: /etc/krb5.conf
    follow: true
    get_checksum: false
  register: __samba_ad_dc_krb5_profile

# With no local profile, openSUSE loads /usr/etc/krb5.conf, which already includes the directory.
- name: initialize | Enable Kerberos snippets in the local profile
  become: true
  become_user: root
  ansible.builtin.lineinfile:
    path: /etc/krb5.conf
    regexp: '^includedir[ \t]+/etc/krb5\.conf\.d/?[ \t]*$'
    line: includedir /etc/krb5.conf.d/
    insertbefore: BOF
    create: true
    mode: "{{ __samba_ad_dc_krb5_profile.stat.mode | default('0644') }}"
    backup: true
  when: __samba_ad_dc_krb5_profile.stat.exists or ansible_facts.os_family != 'Suse'
  notify: restart domain controller

- name: initialize | Provision the first controller of the new domain
  become: true
  become_user: root
  jomrr.samba.samba_provision:
    realm: "{{ samba_ad_dc_realm | upper }}"
    domain: "{{ samba_ad_dc_domain | upper }}"
    hostname: "{{ samba_ad_dc_hostname }}"
    admin_password: "{{ samba_ad_dc_admin_password }}"
    dns_backend: SAMBA_INTERNAL
    function_level: "{{ samba_ad_dc_function_level }}"
    use_rfc2307: "{{ samba_ad_dc_use_rfc2307 }}"
    state: present
  when: samba_ad_dc_mode == 'provision'
  no_log: true

- name: initialize | Join the existing domain as an additional controller
  become: true
  become_user: root
  jomrr.samba.samba_join_dc:
    realm: "{{ samba_ad_dc_realm | upper }}"
    server: "{{ samba_ad_dc_join_server }}"
    domain: "{{ samba_ad_dc_domain | upper }}"
    netbios_name: "{{ samba_ad_dc_hostname | upper }}"
    site: "{{ samba_ad_dc_join_site | default(omit) }}"
    bind_username: Administrator
    bind_password: "{{ samba_ad_dc_admin_password }}"
    dns_backend: SAMBA_INTERNAL
    state: present
  when: samba_ad_dc_mode == 'join'
  no_log: true
