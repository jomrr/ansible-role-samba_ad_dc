---
# role: samba_ad_dc
# file: tasks/main.yml

- name: SAMBA_AD_DC | Install domain controller packages
  ansible.builtin.import_tasks: install.yml

- name: SAMBA_AD_DC | Initialize the domain controller
  ansible.builtin.import_tasks: initialize.yml

- name: SAMBA_AD_DC | Manage schema extensions
  become: true
  become_user: root
  jomrr.samba.samba_schema_extension:
    extension: "{{ __samba_ad_dc_schema_extension }}"
  loop: "{{ samba_ad_dc_schema_extensions }}"
  loop_control:
    loop_var: __samba_ad_dc_schema_extension
    label: "{{ __samba_ad_dc_schema_extension }}"
  notify: restart domain controller

- name: SAMBA_AD_DC | Apply pending configuration changes
  ansible.builtin.meta: flush_handlers

- name: SAMBA_AD_DC | Enable and start the domain controller
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "{{ __samba_ad_dc_service }}"
    masked: false
    enabled: true
    state: started

- name: SAMBA_AD_DC | Wait for the domain controller LDAP listener
  ansible.builtin.wait_for:
    host: "{{ samba_ad_dc_hostname }}.{{ samba_ad_dc_realm | lower }}"
    port: 389
    timeout: 60

- name: SAMBA_AD_DC | Configure domain password policies
  ansible.builtin.import_tasks: passwords.yml
  module_defaults:
    group/jomrr.samba.all:
      server: "{{ samba_ad_dc_hostname }}.{{ samba_ad_dc_realm | lower }}"
      realm: "{{ samba_ad_dc_realm | upper }}"
      bind_username: Administrator
      bind_password: "{{ samba_ad_dc_admin_password }}"
